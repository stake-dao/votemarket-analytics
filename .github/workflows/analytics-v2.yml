name: Analytics V2

on:
  workflow_dispatch: # Allows the workflow to be triggered manually
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
    - cron: "0 19 * * 1"
    - cron: "0 20 * * 1"
    - cron: "0 21 * * 1"
    - cron: "0 22 * * 1"
    - cron: "0 23 * * 1"
    - cron: "0 0 * * 2"
    - cron: "0 1 * * 2"
    - cron: "0 2 * * 2"

concurrency:
  group: votemarket-analytics-publish
  cancel-in-progress: false

env:
  TARGET_DEVOPS_DIR: target-devops
  DEVOPS_DIR: devops
  WEB3_INFURA_PROJECT_ID: ${{ secrets.WEB3_INFURA_PROJECT_ID }}
  ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
  WEB3_ALCHEMY_API_KEY: ${{ secrets.WEB3_ALCHEMY_API_KEY }}
  MODE: ${{ github.event.inputs.mode || 'execute' }} # Set a default value for mode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the votemarket-analytics-v2 repo
        uses: actions/checkout@v4
        with:
          repository: stake-dao/automation-jobs
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          path: ${{ env.DEVOPS_DIR }}
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r ${{ env.DEVOPS_DIR }}/requirements.txt
        shell: bash

      - name: Run the script
        run: |
          cd ${{ env.DEVOPS_DIR }}
          python script/votemarket/analytics.py
        shell: bash
        env:
          PYTHONPATH: script/
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_TOKEN }}
          AGNOSTIC_KEY: ${{ secrets.AGNOSTIC_KEY }}

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: stake-dao/votemarket-analytics
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
          path: ${{ env.TARGET_DEVOPS_DIR }}

      - name: Test publication safeguards
        run: python -m unittest discover -s "${{ env.TARGET_DEVOPS_DIR }}/tests" -p "test_snapshot_publication.py"

      - name: Copy JSON files to target repo
        run: |
          python - <<'PY_COPY'
          import json, os, shutil
          from pathlib import Path
          source = Path(os.environ["DEVOPS_DIR"]) / "json"
          target = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["TARGET_DEVOPS_DIR"] / "analytics"
          retired = {f"votemarket-analytics-{protocol}.json" for protocol in ("balancer", "pendle")}
          files = [path for path in source.glob("votemarket-analytics*.json") if path.name not in retired]
          if not any(path.name == "votemarket-analytics.json" for path in files):
              raise SystemExit("Missing aggregate analytics; refusing to publish")
          for path in files:
              if not isinstance(json.loads(path.read_text()), dict):
                  raise SystemExit(f"Invalid analytics: {path}")
          # Only generated active datasets are replaced. Frozen archives stay untouched.
          target.mkdir(parents=True, exist_ok=True)
          for path in files:
              shutil.copy2(path, target / path.name)
          PY_COPY

      - name: Commit and push changes to repo
        run: |
          cd "${GITHUB_WORKSPACE}/${{ env.TARGET_DEVOPS_DIR }}"
          git config user.email "actions@github.com"
          git config user.name "Stake DAO Automation"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$(date +"%Y-%m-%d %H:%M:%S"): Auto-update analytics data"
          git push
        shell: bash
